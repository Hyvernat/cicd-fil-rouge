name: CI

on:
  push:
    branches: ["feat/ci-rapide"]
  pull_request:
    branches: ["main"]

# Annule les anciennes exécutions de la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint avec Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Vérifier le code
        run: ruff check .

  test:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Exécuter les tests et générer le rapport
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()

    steps:
      - name: Vérifier les résultats de la CI
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "Résultat lint : $LINT_RESULT"
          echo "Résultat tests : $TEST_RESULT"
          test "$LINT_RESULT" = "success"
          test "$TEST_RESULT" = "success"